# MySQL. Versions 5.6.4 and up are supported.
#
# Install the MySQL driver
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
#   gem "mysql2"
#
# And be sure to use new-style password hashing:
#   https://dev.mysql.com/doc/refman/5.7/en/password-hashing.html
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USER", "root") %>
  password: <%= ENV.fetch("DB_PASS", "") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>

development:
  <<: *default
  database: formularios_app_development

test:
  <<: *default
  database: formularios_app_test

production:
  primary: &primary_production
    <<: *default
    database: formularios_app_production
    username: formularios_app
    password: <%= ENV["FORMULARIOS_APP_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: formularios_app_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: formularios_app_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: formularios_app_production_cable
    migrations_paths: db/cable_migrate
